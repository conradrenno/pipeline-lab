name: "Lab 08 - Estrutura de Diretórios e Arquivos"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20.5.0"

jobs:
  demonstrar-estrutura:
    name: "Demonstrar Estrutura Básica"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Mostrar estrutura .github/workflows
        run: |
          echo "=== ESTRUTURA DO DIRETÓRIO .github/workflows ==="
          ls -la .github/workflows/
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows/*.y*ml 2>/dev/null | wc -l)"

      - name: Elementos obrigatórios do workflow
        run: |
          echo "=== ELEMENTOS OBRIGATÓRIOS DO WORKFLOW ==="
          echo "1. name: Nome do workflow"
          echo "2. on: Eventos que disparam o workflow"
          echo "3. jobs: Conjunto de trabalhos a serem executados"
          echo "4. runs-on: Ambiente de execução do trabalho"
          echo "5. steps: Passos a serem executados dentro do trabalho"

      - name: Variáveis e contextos
        run: |
          echo "=== VARIÁVEIS E CONTEXTOS ==="
          echo "Variável env: ${{env.NODE_VERSION}}"
          echo "Repositório: ${{github.repository}}"
          echo "Branch: ${{github.ref_name}}"
          echo "Actor: ${{github.actor}}"
