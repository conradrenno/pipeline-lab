name: "Demonstração de variáveis de ambiente"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Variáveis globais do workflow
env:
  WORKFLOW_VAR: "Valor global do workflow"
  AMBIENTE: "Desenvolvimento"
  VERSAO_APP: "1.0.0"

jobs:
  #Job 1: Análise de código
  demonstracao-variaveis:
    runs-on: ubuntu-latest

    env:
      JOB_VAR: "Valor específico do job"
      USUARIO: "Desenvolvedor"

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Exibir variáveis do workflow
      run: |
        echo "Variável do workflow: ${{env.WORKFLOW_VAR}}"
        echo "Variável de ambiente: ${{env.AMBIENTE}}"
        echo "Variável de usuário: ${{env.VERSAO_APP}}"

    - name: Exibir variáveis do job
      run: |
        echo "Variável do job: ${{env.JOB_VAR}}"
        echo "Variável de usuário: ${{env.USUARIO}}"

    - name: Exibir variáveis do step
      env:
        STEP_VAR: "Valor específico do step"
        MENSAGEM: "Executando step de demonstração"
      run: |
        echo "=== Variáveis do Step ==="
        echo "Variável do step: ${{env.STEP_VAR}}"
        echo "Mensagem do step: ${{env.MENSAGEM}}"