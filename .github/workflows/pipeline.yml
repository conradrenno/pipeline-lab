name: "Hello Github Actions"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Executar Hello World
        run: echo "Hello Github Actions"

      - name: Mostrar informações do sistema
        run: |
          echo "Sistema Operacional: ${{ runner.os}}"
          echo "Diretório Atual: $(pwd)"
          echo "Data e Hora: $(date)"
          echo "Usuário: $(whoami)"

      - name: Listar arquivos do repositório
        run: ls -la

      - name: COmandos múltiplos
        run: |
          echo "Este é o lab 01 de Github Actions"
          echo "Workflow executado com sucesso"
