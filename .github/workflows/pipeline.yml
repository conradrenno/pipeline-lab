name: "Demo GitHub Secrets"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  #Job 1: Análise de código
  demonstracao-secrets:
    runs-on: ubuntu-latest

    env:
      JOB_VAR: "Valor específico do job"
      USUARIO: "Desenvolvedor"

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # Step 2: Demonstrar uso de secrets em variáveis de ambiente
    - name: Configurar credenciais da API
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "=== Configuração de Credenciais da API ==="
        echo "URL da API: $API_URL"
        echo "Chave da API: ${API_KEY:+SIM}"

    - name: Conectar com DB
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: |
        echo "=== Conexão com o Banco de Dados ==="
        echo "Host: $DB_HOST"
        echo "Port: $DB_PORT"
        echo "User: $DB_USER"
        echo "Password: $DB_PASSWORD"

    - name: Exibir variáveis do step
      env:
        STEP_VAR: "Valor específico do step"
        MENSAGEM: "Executando step de demonstração"
      run: |
        echo "=== Variáveis do Step ==="
        echo "Variável do step: ${{env.STEP_VAR}}"
        echo "Mensagem do step: ${{env.MENSAGEM}}"